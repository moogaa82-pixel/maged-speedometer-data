name: Firebase Crowdsourced Bumps Sync

on:
  schedule:
    - cron: '0 3 * * *' # Runs daily at 3:00 AM UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-bumps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Firebase Auto-Sync Script
        run: python scripts/firebase_github_sync.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add blacklisted_nodes.json speed_bumps.geojson radars.geojson app/src/main/assets/speed_bumps.geojson app/src/main/assets/radars.geojson
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto(data): sync crowdsourced bumps and radars from Firebase" && git push)
